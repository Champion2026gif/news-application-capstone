{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="panel">
    <h1>Create an account</h1>
    <p>Choose a Reader, Journalist, or Editor account so you can access the matching dashboard.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p class="meta">Already registered? <a href="{% url 'login' %}">Log in here</a>.</p>
</div>
{% endblock %}
