{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="panel">
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
    <p class="meta">Don't have an account? <a href="{% url 'accounts:register' %}">Register as a Reader, Journalist, or Editor</a>.</p>
</div>
{% endblock %}
